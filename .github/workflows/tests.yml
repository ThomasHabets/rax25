name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: apt install deps
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo --preserve-env=DEBIAN_FRONTEND apt-get install -y \
          libudev-dev tshark direwolf pipewire pipewire-pulse wireplumber \
          pulseaudio-utils dbus-daemon libasound2-dev libasound2-plugins \
          libjack-jackd2-dev pkg-config
    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: rustup install nightly
      run:  rustup install nightly
    - name: Rustup install nightly clippy
      run:  rustup component add --toolchain nightly clippy
    - name: Cargo install deps
      run:  cargo install tickbox
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run:  CLEANUP=true tickbox --dir tickbox/pre-commit --disable-tui
    - name: Upload audio interop failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: direwolf-interop-failure
        path: |
          target/*.test.direwolf/direwolf_interop/*/*.log
          target/*.test.direwolf/direwolf_interop/*/*.pcap
          target/*.test.direwolf/direwolf_interop/*/*.conf
        if-no-files-found: ignore
